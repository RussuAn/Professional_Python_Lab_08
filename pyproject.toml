[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager-lab08"
version = "0.8.0"
description = "Student REST API using FastAPI, SQLite, Pydantic and asyncio"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Руссу Анастасія"}]
dependencies = ["fastapi>=0.110", "uvicorn>=0.28", "pydantic>=2", "httpx>=0.27", "SQLAlchemy>=2.0,<3", "alembic>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
